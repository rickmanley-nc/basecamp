name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    name: Repository check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile=false

      - name: Check
        run: pnpm check

  postgres-validation:
    name: PostgreSQL persistence and runtime validation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: basecamp
          POSTGRES_USER: basecamp
          POSTGRES_PASSWORD: change-me-ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U basecamp -d basecamp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      BASECAMP_DATABASE_URL: postgresql://basecamp:change-me-ci-postgres-password@127.0.0.1:5432/basecamp
      BASECAMP_POSTGRES_SSL: disable
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile=false

      - name: PostgreSQL migrate and seed
        run: pnpm ops:postgres:migrate

      - name: Create portable SQLite export
        run: pnpm ops:export

      - name: Import portable export into PostgreSQL
        run: pnpm ops:postgres:import

      - name: PostgreSQL runtime import
        env:
          BASECAMP_DATABASE_KIND: postgresql
          BASECAMP_IMPORT_FILE: var/exports/latest/basecamp-export.json
        run: pnpm ops:import

      - name: PostgreSQL runtime local-user ops
        run: |
          BASECAMP_DATABASE_KIND=postgresql \
          BASECAMP_USER_USERNAME="ci-admin-${GITHUB_RUN_ID}" \
          BASECAMP_USER_DISPLAY_NAME="CI Admin" \
          BASECAMP_USER_PASSWORD="correct horse battery staple" \
          pnpm ops:user:create

          BASECAMP_DATABASE_KIND=postgresql \
          BASECAMP_USER_USERNAME="ci-admin-${GITHUB_RUN_ID}" \
          pnpm ops:user:disable

      - name: PostgreSQL API runtime smoke
        env:
          BASECAMP_DATABASE_KIND: postgresql
        run: pnpm test tests/postgres-server-runtime.test.ts

      - name: PostgreSQL runtime export
        env:
          BASECAMP_DATABASE_KIND: postgresql
          BASECAMP_EXPORT_DIR: var/exports/postgres-runtime
        run: pnpm ops:export

      - name: PostgreSQL runtime backup
        env:
          BASECAMP_DATABASE_KIND: postgresql
          BASECAMP_BACKUP_DIR: var/backups/postgres-runtime
        run: pnpm ops:backup

      - name: PostgreSQL status
        run: pnpm ops:postgres:status
