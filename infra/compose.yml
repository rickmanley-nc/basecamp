name: basecamp

services:
  server:
    build:
      context: ..
      dockerfile: infra/server.Dockerfile
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 4317
      BASECAMP_APP_VERSION: ${BASECAMP_APP_VERSION:-0.7.2}
      BASECAMP_PUBLIC_URL: ${BASECAMP_PUBLIC_URL:-http://basecamp.local:8080}
      BASECAMP_WEB_URL: ${BASECAMP_WEB_URL:-http://basecamp.local:8080}
      BASECAMP_ADMIN_TOKEN: ${BASECAMP_ADMIN_TOKEN:-change-me-generate-a-random-token}
      BASECAMP_DB_PATH: /var/lib/basecamp/basecamp.sqlite
      BASECAMP_STORAGE_DIR: /var/lib/basecamp/storage
      BASECAMP_BACKUP_DIR: /var/backups/basecamp
      BASECAMP_REMOTE_ACCESS: ${BASECAMP_REMOTE_ACCESS:-lan}
      BASECAMP_LOG_LEVEL: ${BASECAMP_LOG_LEVEL:-info}
    volumes:
      - basecamp_database:/var/lib/basecamp
      - basecamp_storage:/var/lib/basecamp/storage
      - basecamp_backups:/var/backups/basecamp
    expose:
      - "4317"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4317/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: ..
      dockerfile: infra/web.Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  proxy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
      web:
        condition: service_healthy
    ports:
      - "${BASECAMP_HTTP_PORT:-8080}:8080"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/live"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  backup:
    build:
      context: ..
      dockerfile: infra/server.Dockerfile
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      BASECAMP_APP_VERSION: ${BASECAMP_APP_VERSION:-0.7.2}
      BASECAMP_DB_PATH: /var/lib/basecamp/basecamp.sqlite
      BASECAMP_STORAGE_DIR: /var/lib/basecamp/storage
      BASECAMP_BACKUP_DIR: /var/backups/basecamp
      BASECAMP_CONFIG_PATH: /etc/basecamp/basecamp.env
      BASECAMP_BACKUP_INTERVAL_SECONDS: ${BASECAMP_BACKUP_INTERVAL_SECONDS:-86400}
    command: ["sh", "-lc", "while true; do pnpm ops:backup; sleep ${BASECAMP_BACKUP_INTERVAL_SECONDS:-86400}; done"]
    volumes:
      - basecamp_database:/var/lib/basecamp
      - basecamp_storage:/var/lib/basecamp/storage
      - basecamp_backups:/var/backups/basecamp
      - ${BASECAMP_CONFIG_SOURCE:-./basecamp.env}:/etc/basecamp/basecamp.env:ro
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('fs'); process.exit(fs.existsSync('/var/backups/basecamp/latest-backup.json')?0:1)"]
      interval: 5m
      timeout: 5s
      retries: 3
      start_period: 2m

volumes:
  basecamp_database:
  basecamp_storage:
  basecamp_backups:
  caddy_data:
  caddy_config:
